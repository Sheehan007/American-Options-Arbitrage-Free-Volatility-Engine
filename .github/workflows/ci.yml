name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAOFVE_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run example
        run: ./build/aofve_example

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install extension
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Test bindings
        run: pytest -q tests/test_python.py

  quantlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QuantLib
        run: sudo apt-get update && sudo apt-get install --yes libquantlib0-dev
      - name: Configure comparison benchmark
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DAOFVE_BUILD_EXAMPLES=OFF
          -DAOFVE_WITH_QUANTLIB=ON
      - name: Build and run comparison
        run: cmake --build build --parallel 2 && ./build/aofve_quantlib_benchmark
